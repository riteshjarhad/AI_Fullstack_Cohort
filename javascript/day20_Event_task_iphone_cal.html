
<!DOCTYPE html>
<html>
<head>
    <title>iPhone Calculator</title>

    <style>
        body {
            background: #ddd;
            font-family: Arial;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .calculator {
            width: 280px;
            background: black;
            padding: 20px;
            border-radius: 35px;
        }

        #display {
            color: white;
            font-size: 45px;
            text-align: right;
            padding: 20px 10px;
            height: 70px;
            overflow: hidden;
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }

        button {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            border: none;
            font-size: 22px;
            cursor: pointer;
            background: #333;
            color: white;
        }

        .gray {
            background: #a5a5a5;
            color: black;
        }

        .orange {
            background: orange;
        }

        .zero {
            grid-column: span 2;
            width: 130px;
            border-radius: 40px;
        }
    </style>
</head>

<body>

    <div class="calculator">

        <div id="display">0</div>

        <div class="buttons">
            <button class="gray" data-value="C">C</button>
            <button class="gray" data-value="+/-">+/-</button>
            <button class="gray" data-value="%">%</button>
            <button class="orange" data-value="/">÷</button>

            <button data-value="7">7</button>
            <button data-value="8">8</button>
            <button data-value="9">9</button>
            <button class="orange" data-value="*">×</button>

            <button data-value="4">4</button>
            <button data-value="5">5</button>
            <button data-value="6">6</button>
            <button class="orange" data-value="-">−</button>

            <button data-value="1">1</button>
            <button data-value="2">2</button>
            <button data-value="3">3</button>
            <button class="orange" data-value="+">+</button>

            <button class="zero" data-value="0">0</button>
            <button data-value=".">.</button>
            <button class="orange" data-value="=">=</button>
        </div>

    </div>

    <script>
        let display = document.getElementById("display");

        let firstNumber = "";
        let secondNumber = "";
        let operator = "";
        let isSecond = false;

        let buttons = document.querySelectorAll("button");

        buttons.forEach(function(button) {
            button.addEventListener("click", function() {
                let value = button.getAttribute("data-value");

                if (value >= "0" && value <= "9" || value == ".") {
                    if (!isSecond) {
                        if (value == "." && firstNumber.includes(".")) return;
                        firstNumber += value;
                        display.innerText = firstNumber;
                    } else {
                        if (value == "." && secondNumber.includes(".")) return;
                        secondNumber += value;
                        display.innerText = secondNumber;
                    }
                }

                else if (value == "C") {
                    firstNumber = "";
                    secondNumber = "";
                    operator = "";
                    isSecond = false;
                    display.innerText = "0";
                }

                else if (value == "+/-") {
                    if (!isSecond) {
                        firstNumber = String(Number(firstNumber || 0) * -1);
                        display.innerText = firstNumber;
                    } else {
                        secondNumber = String(Number(secondNumber || 0) * -1);
                        display.innerText = secondNumber;
                    }
                }

                else if (value == "%") {
                    if (!isSecond) {
                        firstNumber = String(Number(firstNumber || 0) / 100);
                        display.innerText = firstNumber;
                    } else {
                        secondNumber = String(Number(secondNumber || 0) / 100);
                        display.innerText = secondNumber;
                    }
                }

                else if (value == "+" || value == "-" ||
                         value == "*" || value == "/") {
                    if (firstNumber !== "" && !isSecond) {
                        operator = value;
                        isSecond = true;
                    }
                }

                else if (value == "=") {
                    if (firstNumber !== "" && secondNumber !== "" && operator !== "") {
                        let a = Number(firstNumber);
                        let b = Number(secondNumber);
                        let result;

                        if (operator == "+") {
                            result = a + b;
                        }
                        else if (operator == "-") {
                            result = a - b;
                        }
                        else if (operator == "*") {
                            result = a * b;
                        }
                        else if (operator == "/") {
                            if (b == 0) {
                                display.innerText = "Error";
                                firstNumber = "";
                                secondNumber = "";
                                operator = "";
                                isSecond = false;
                                return;
                            }
                            result = a / b;
                        }

                        display.innerText = result;
                        firstNumber = String(result);
                        secondNumber = "";
                        operator = "";
                        isSecond = false;
                    }
                }
            });
        });
    </script>

</body>
</html>
