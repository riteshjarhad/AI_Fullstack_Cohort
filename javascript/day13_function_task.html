<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        function calculate(callback) {

            function sum(a, b) {
                return a + b;
            }

            let result = sum(10, 20);

            callback(result);
        }

        function display(value) {
            console.log("Sum is:", value);
        }

        calculate(display);
    </script>
</body>

</html>
