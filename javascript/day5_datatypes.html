<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Datatypes</title>
</head>

<body>
    <h1>Datatypes In JS</h1>
    <hr>

    <script>
        let name = "Ritesh";
        console.log(name);

        // Predefined datatypes
        // number
        let age = 30;
        let person_b_age = 30.5;
        console.log(age);
        console.log(person_b_age);
        console.log(typeof age);
        console.log(typeof person_b_age);

        // string
        let empRole = "AI Engineer";
        let empRole2 = "Devops Engineer";
        console.log(empRole);
        console.log(empRole2);
        console.log(typeof empRole);
        console.log(typeof empRole2);

        // boolean
        let isEligible=false;
        console.log(isEligible);
        console.log(typeof isEligible);

        // null
        let empId=null;
        // empId=1234;
        console.log(empId);
        console.log(typeof empId);

        // empty
        let empCTC="";
        console.log(empCTC);
        console.log(typeof empCTC);

        // undefined
        let a;
        console.log(a);
        console.log(typeof a);

        // symbol
        let no1=20;
        let no2=20;
        console.log(no1==no2);
        console.log(Symbol(no1)==Symbol(no2));

        // big int
        // const abc;
        // console.log(abc);

        // Non_Predefined Datatype
        // array
        let skill=["ReactJS","NextJS","AWS","Data Science",true,null,["Ritesh","Shreyash"]];
        console.log(skill);
        console.log(typeof skill);

        // intern
        let intern_Stipend="10k";
        let intern_Name="Chris";
        let intern_Skill="HTML";
        let intern_Id=1234;

        // 
        let intern1=["Chris","10k","HTML","1234"];

        //object 
        let obj={
            intern_Name:"Ritesh",
            intern_Id:"12345",
            intern_Skill:"HTML",
            intern_Stipend:"10k",
            isEligible:true
        }
        console.log(obj);
        console.log(typeof obj);

    </script>
</body>

</html>
