<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Nested Div</h1>
    <hr>

    <div style="height: 300px; width: 100%;background-color: orange;float: left;"></div>
    <hr>

    <div style="height: 100px;width: 10%;background-color: aqua;float: left;"></div>
    <div style="height: 100px;width: 10%;background-color: rgb(0, 255, 94);float: left;"></div>
    <div style="height: 100px;width: 10%;background-color: rgb(255, 0, 170);float: left;"></div>
    <div style="height: 100px;width: 10%;background-color: rgb(22, 22, 92);float: left;"></div>
    <div style="height: 100px;width: 10%;background-color: purple;float: left;"></div>
    <div style="height: 100px;width: 10%;background-color: firebrick;float: left;"></div>
    <div style="height: 100px;width: 10%;background-color: yellowgreen;float: left;"></div>
    <div style="height: 100px;width: 10%;background-color: darkorange;float: left;"></div>
    <div style="height: 100px;width: 10%;background-color: chartreuse;float: left;"></div>
    <div style="height: 100px;width: 10%;background-color: olivedrab;float: left;"></div>
    <hr>

    <div style="height: 300px;width: 100%;background-color: black;float: left;">
        <div style="height: 100%;width: 33.33%;background-color: aqua;float: left;"></div>
        <div style="height: 100%;width: 33.33%;background-color: blueviolet;float: left;"></div>
        <div style="height: 100%;width: 33.33%;background-color: rgb(226, 83, 43);float: left;"></div>
    </div>
    <hr>

    <div style="height: 300px;width: 50%;background-color: brown;float: left;">
       <div style="height: 50%;width: 50%;background-color: cadetblue;float: left">
            <div style="height: 50%;width: 50%;background-color: aqua;float: left;"></div>
            <div style="height: 50%;width: 50%;background-color: rgb(255, 0, 170);float: left;"></div>
            <div style="height: 50%;width: 50%;background-color: palegoldenrod;float: left;"></div>
            <div style="height: 50%;width: 50%;background-color: khaki;float: left;"></div>

        <div style="height: 50%;width: 50%;background-color: darkcyan;float: left;"></div>

        <div style="height: 50%;width: 50%;background-color: chocolate;float: left;"></div>

        <div style="height: 50%;width: 50%;background-color: yellow;float: left;"></div>

    </div>
    
    <div style="height: 300px;width: 50%;background-color: violet;float: left;"></div>
</body>
</html>
