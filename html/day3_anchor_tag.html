<!DOCTYPE html>
<html lang="en">
<head>
    <!-- meta tags -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anchor Tag</title>
</head>
<body>
    <h1>Anchor tag- used for redirecting from one page to another page</h1>
    <hr>
    <img src="../assets/nature.jpg" alt="this is nature image" height="100px" width="100px" title="Nature pic">
    
    <!-- href attribute- hyper link, link or path
         title attribute- tool tip message same as img tag
         target attribute- to open page in new tab  -->
    <a href="https://www.google.com" title="visit to google" target="_blank">click here</a>
    <a href="./day3_img.html" target="_blank">go to day 3 image file</a>
</body>
</html>
