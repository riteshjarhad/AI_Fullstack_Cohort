<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
        }
    </style>
</head>

<body>
    <h1>Student Registrtion Form</h1>

    <form action="" style="height: 900px;width: 900px;background-color: blueviolet;padding: 20px;color: white;">
        <label for="" style="display: inline-block;width: 150px;">FIRST NAME</label>
        <input type="text" name="firstname" id="firstname">
        <br><br>

        <label for="" style="display: inline-block;width: 150px;">LAST NAME</label>
        <input type="text" name="lastname" id="lastname">
        <br><br>

        <label for="" style="display: inline-block;width: 150px;">DATE OF BIRTH</label>
        <input type="date" name="date of birth" id="date of birth">
        <br><br>

        <label for="" style="display: inline-block;width: 150px;">EMAIL ID</label>
        <input type="email" name="usermail" id="usermail">
        <br><br>

        <label for="" style="display: inline-block;width: 150px;">MOBILE NUMBER</label>
        <input type="number" name="phone" id="phone">
        <br><br>

        <label for="" style="display: inline-block;width: 150px;">GENDER</label>
        <input type="radio" name="gender" id="gender" value="Male"><span>Male</span>
        <input type="radio" name="gender" id="gender" value="Female"><span>Female</span>
        <br><br>

        <label for="" style="vertical-align: top;display: inline-block;width: 150px;">ADDRESS</label>
        <textarea name="" id="" style="height: 100px;width: 50%;"></textarea>
        <br><br>

        <label for="" style="display: inline-block;width: 150px;">CITY</label>
        <input type="text" name="city" id="city">
        <br><br>

        <label for="" style="display: inline-block;width: 150px;">PIN CODE</label>
        <input type="number" name="pincodenum" id="pincodenum">
        <br><br>

        <label for="" style="display: inline-block;width: 150px;">STATE</label>
        <input type="text" name="statename" id="statename">
        <br><br>

        <label for="" style="display: inline-block;width: 150px;">COUNTRY</label>
        <input type="text" name="countryname" id="countryname">
        <br><br>

        <label for="" style="display: inline-block;width: 150px;">HOBBIES</label>
        <input type="checkbox" name="hobbies" id="hobbies" value="Drawing"><span>Drawing</span>
        <input type="checkbox" name="hobbies" id="hobbies" value="Singing"><span>Singing</span>
        <input type="checkbox" name="hobbies" id="hobbies" value="Dancing"><span>Dancing</span>
        <input type="checkbox" name="hobbies" id="hobbies" value="Sketching"><span>Sketching</span>
        <br>
        <label for="" style="display: inline-block;width: 150px;"></label>
        <input type="checkbox" name="otherhobbies" id="otherhobbies" value="Others"><span>Others</span>
        <input type="text" name="otherhobbies" id="otherhobbies" >
        <br><br>
        
        <label for="" style="display: inline-block;width: 150px;">QUALIFICATION</label>
        <table border="" cellpadding="0px" cellspacing="10px" style="margin-top: 20px;margin-left: 150px;">
            <tr>
                <th>SI.No.</th>
                <th>Examination</th>
                <th>Board</th>
                <th>Percentage</th>
                <th>Year of Passing</th>
            </tr>
            <tr>
                <td>1</td>
                <td>Class X</td>
                <td><input type="text"></td>
                <td><input type="text"></td>
                <td><input type="text"></td>
            </tr>
            <tr>
                <td>2</td>
                <td>Class XII</td>
                <td><input type="text"></td>
                <td><input type="text"></td>
                <td><input type="text"></td> 
            </tr>
            <tr>
                
                <td>3</td>
                <td>Graduation</td>
                <td><input type="text"></td>
                <td><input type="text"></td>
                <td><input type="text"></td>
            </tr>
            <tr>
                
                <td>4</td>
                <td>Masters</td>
                <td><input type="text"></td>
                <td><input type="text"></td>
                <td><input type="text"></td>
            </tr>
        </table>

        <label for="" style="display: inline-block;width: 150px;">COURSES APPLIED FOR</label>
        <input type="radio" name="courseapplied" id="courseapplied" value="BCA"><span>BCA</span>
        <input type="radio" name="courseapplied" id="courseapplied" value="B.Com"><span>B.Com</span>
        <input type="radio" name="courseapplied" id="courseapplied" value="BCA"><span>BCS</span>
        <input type="radio" name="courseapplied" id="courseapplied" value="BA"><span>BA</span>
        <br><br>

        <center>
            <input type="submit" name="" id="">
            <input type="reset" name="" id="">
        </center>

    </form>
    
</body>
</html>
